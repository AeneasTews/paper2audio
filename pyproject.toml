[project]
name = "paper2audio"
version = "0.1.0"
description = "Turn scientific papers (PDF) into audio files using ollama's phonon"
requires-python = ">=3.10"
dependencies = ["pypdf>=5", "lameenc>=1.7"]

[project.scripts]
paper2audio = "paper2audio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
