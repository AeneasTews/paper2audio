[project]
name = "paper2audio"
version = "0.1.0"
description = "Turn scientific papers (PDF) into audio files using ollama's phonon"
requires-python = ">=3.11"  # tomllib
dependencies = [
    "pypdf>=5",
    "pillow>=10",
    "pypdfium2>=5.14.0",
    "av>=18.1.0",
]

[project.scripts]
paper2audio = "paper2audio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
